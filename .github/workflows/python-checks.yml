name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: uv python install 3.12.16
      - name: Install locked project and development dependencies
        run: uv sync --locked --python 3.12.16 --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Run tests
        run: uv run pytest
      - name: Validate notebook JSON
        run: python -m json.tool notebooks/remote_coding_agent_colab.ipynb > /dev/null
      - name: Compile notebook Python cells
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          notebook = json.loads(Path("notebooks/remote_coding_agent_colab.ipynb").read_text())
          for index, cell in enumerate(notebook.get("cells", [])):
              if cell.get("cell_type") == "code":
                  compile("".join(cell.get("source", [])), f"notebook-cell-{index}", "exec", flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT)
          PY
      - name: Validate Ubuntu scripts
        run: bash -n scripts/setup-ubuntu.sh scripts/up.sh
