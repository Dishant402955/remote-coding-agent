name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: uv python install 3.11
      - name: Install package and development dependencies
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Run tests
        run: uv run pytest
      - name: Build Docker image
        run: docker build --tag remote-coding-agent:ci .
      - name: Validate Colab notebook JSON
        run: python -m json.tool notebooks/remote_coding_agent_colab.ipynb > /dev/null
