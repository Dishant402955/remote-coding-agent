services:
  remote-coding-agent:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN before starting}
      REMOTE_CODING_AGENT_HOST: 0.0.0.0
      REMOTE_CODING_AGENT_PORT: "8000"
      REMOTE_CODING_AGENT_WORKSPACE: /workspace
      REMOTE_CODING_AGENT_DEFAULT_TIMEOUT_SECONDS: ${REMOTE_CODING_AGENT_DEFAULT_TIMEOUT_SECONDS:-30}
      REMOTE_CODING_AGENT_MAX_TIMEOUT_SECONDS: ${REMOTE_CODING_AGENT_MAX_TIMEOUT_SECONDS:-300}
      REMOTE_CODING_AGENT_MAX_OUTPUT_CHARS: ${REMOTE_CODING_AGENT_MAX_OUTPUT_CHARS:-20000}
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    volumes:
      - ./workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8000), timeout=2); s.close()"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
